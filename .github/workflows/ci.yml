name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    name: Tests (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          - os: macos-latest
            python-version: "3.9"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install rich pygments pyyaml toml networkx pytest
          pip install radon bandit || true

      - name: Run test suite
        run: pytest tests/ -v --tb=short

  lint:
    name: Lint & Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff (errors only)
        run: ruff check --select=E9,F63,F7,F82 --output-format=github .
      - name: Compile all modules
        run: python -m compileall -q .

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install rich pygments pyyaml toml networkx
      - name: Analyze this repository with itself
        run: |
          python smartrepo_analyzer.py analyze . --no-lint -q -o ./self-analysis
          test -f ./self-analysis/readme-enhanced.md
          test -f ./self-analysis/ai-summary.json
          test -f ./self-analysis/report.html
      - uses: actions/upload-artifact@v4
        with:
          name: self-analysis-report
          path: self-analysis/
